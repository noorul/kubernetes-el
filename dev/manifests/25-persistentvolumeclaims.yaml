apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bound-data
  namespace: kubernetes-el-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pending-data
  namespace: kubernetes-el-demo
  labels:
    scenario: pending
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: does-not-exist
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bound-data-consumer
  namespace: kubernetes-el-demo
  labels:
    app: bound-data-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bound-data-consumer
  template:
    metadata:
      labels:
        app: bound-data-consumer
    spec:
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 30 & wait; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bound-data
