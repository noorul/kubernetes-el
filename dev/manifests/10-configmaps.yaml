apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kubernetes-el-demo
data:
  LOG_LEVEL: "info"
  FEATURE_FLAG_X: "true"
  MESSAGE: "hello from kubernetes-el"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: large-config
  namespace: kubernetes-el-demo
data:
  nginx.conf: |
    worker_processes 4;
    events { worker_connections 1024; }
    http {
      include mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      gzip on;
      server {
        listen 80;
        server_name localhost;
        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
          root /usr/share/nginx/html;
        }
      }
    }
  motd.txt: |
    ================================================================
     Welcome to the kubernetes-el demo cluster.
     This ConfigMap is intentionally verbose so the describe / yaml
     views have something meaningful to page through.
    ================================================================
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.
    Duis aute irure dolor in reprehenderit in voluptate velit esse.
    Excepteur sint occaecat cupidatat non proident, sunt in culpa qui
    officia deserunt mollit anim id est laborum.
  feature-flags.json: |
    {
      "flags": {
        "new_ui": true,
        "beta_search": false,
        "experimental_cache": true,
        "rollout_percent": 25
      },
      "audiences": ["internal", "beta"],
      "notes": "toggle values are illustrative only"
    }
